<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LionHome 狮城家 — Property Affordability Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #E8DFD0; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="lh-components.jsx"></script>
<script type="text/babel" src="lh-mobile-flow.jsx"></script>
<script type="text/babel" src="lh-mobile-result.jsx"></script>
<script type="text/babel" src="lh-desktop-spec.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

// Phone wrapper — embeds a screen inside the iOS bezel at 375 design width.
// We use the IOSDevice frame at native 402 px width but position content as 375.
function Phone({ children, label, height = 812 }) {
  return (
    <IOSDevice width={375} height={height}>
      {children}
    </IOSDevice>
  );
}

function App() {
  return (
    <DesignCanvas
      title="LionHome 狮城家"
      subtitle="Property Affordability Calculator · Friendly Guide direction · zh-CN"
      initialZoom={0.6}
    >
      <DCSection id="mobile" title="Mobile · 375 px (primary)">
        <DCArtboard id="m-hero" label="01 · Hero / Landing" width={375} height={812}>
          <Phone><MobileHero /></Phone>
        </DCArtboard>
        <DCArtboard id="m-step1" label="02 · Step 1 — Identity" width={375} height={812}>
          <Phone><MobileStep1 /></Phone>
        </DCArtboard>
        <DCArtboard id="m-step2" label="03 · Step 2 — Family" width={375} height={812}>
          <Phone><MobileStep2 /></Phone>
        </DCArtboard>
        <DCArtboard id="m-step3" label="04 · Step 3 — Income" width={375} height={812}>
          <Phone><MobileStep3 /></Phone>
        </DCArtboard>
        <DCArtboard id="m-step4" label="05 · Step 4 — Cash" width={375} height={812}>
          <Phone><MobileStep4 /></Phone>
        </DCArtboard>
        <DCArtboard id="m-step5" label="06 · Step 5 — Preferences" width={375} height={812}>
          <Phone><MobileStep5 /></Phone>
        </DCArtboard>
        <DCArtboard id="m-loading" label="07 · Loading" width={375} height={812}>
          <Phone><MobileLoading /></Phone>
        </DCArtboard>
        <DCArtboard id="m-result" label="08 · Result (scrolls)" width={375} height={1480}>
          <IOSDevice width={375} height={1480}><MobileResult /></IOSDevice>
        </DCArtboard>
        <DCArtboard id="m-modal" label="09 · Lead capture modal" width={375} height={812}>
          <Phone><MobileLeadModal /></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="desktop" title="Desktop · 1440 px (secondary)">
        <DCArtboard id="d-hero" label="Desktop · Hero / Landing" width={1440} height={1180}>
          <DesktopHero />
        </DCArtboard>
        <DCArtboard id="d-result" label="Desktop · Result" width={1440} height={1380}>
          <DesktopResult />
        </DCArtboard>
      </DCSection>

      <DCSection id="spec" title="Specs · Tokens, components, copy tone">
        <DCArtboard id="spec-sheet" label="Spec sheet" width={760} height={1100}>
          <SpecSheet />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
